<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Welcome</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="screen">
    <div class="bar">
      <span class="brand"><span class="mark">N</span>Northline Field</span>
      <span class="steps"><span class="done"></span><span></span><span></span></span>
    </div>
    <svg viewBox="0 0 350 210" role="img" aria-label="A van on its route between three jobs" style="width: 100%; height: auto; margin-bottom: 28px">
      <rect width="350" height="210" rx="20" fill="var(--muted)"/>
      <path d="M40 160 C 110 160, 120 70, 190 80 S 280 140, 310 60" fill="none" stroke="var(--foreground)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
      <circle cx="40" cy="160" r="11" fill="var(--card)" stroke="var(--foreground)" stroke-width="3"/>
      <circle cx="190" cy="80" r="11" fill="var(--card)" stroke="var(--foreground)" stroke-width="3"/>
      <circle cx="310" cy="60" r="14" fill="var(--foreground)"/>
      <path d="M304 60 l5 5 l9 -10" fill="none" stroke="var(--background)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Every job, one tap away.</h1>
    <p class="lede">See today's route, the parts on your van, and what each customer needs before you knock.</p>
    <div class="grow"></div>
    <div class="actions">
      <a class="button" href="#">Get started</a>
      <a class="button ghost" href="#">I already have an account</a>
    </div>
  </div>
</body>
</html>
