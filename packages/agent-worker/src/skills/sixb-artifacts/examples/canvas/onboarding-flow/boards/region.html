<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Choose a region</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="screen">
    <div class="bar">
      <span class="brand"><span class="mark">N</span>Northline Field</span>
      <span class="steps"><span class="done"></span><span class="done"></span><span></span></span>
    </div>
    <h1>Where do you work?</h1>
    <p class="lede">We'll load your depot's jobs and the parts its vans carry.</p>
    <div class="field">
      <input type="search" placeholder="Search regions" aria-label="Search regions">
    </div>
    <div class="choice selected"><span class="radio"></span><span><b>North</b><small class="muted">Depot 4, Ridge Road</small></span><span class="count">31 jobs</span></div>
    <div class="choice"><span class="radio"></span><span><b>Harbor</b><small class="muted">Depot 2, Pier Road</small></span><span class="count">24 jobs</span></div>
    <div class="choice"><span class="radio"></span><span><b>Keystone</b><small class="muted">Depot 7, Mill Street</small></span><span class="count">19 jobs</span></div>
    <div class="choice"><span class="radio"></span><span><b>Elm Valley</b><small class="muted">Depot 5, Orchard Lane</small></span><span class="count">15 jobs</span></div>
    <div class="grow"></div>
    <div class="actions">
      <button type="button">Continue</button>
    </div>
  </div>
</body>
</html>
