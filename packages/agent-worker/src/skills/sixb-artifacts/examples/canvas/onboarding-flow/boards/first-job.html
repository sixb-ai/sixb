<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Your first job</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="screen">
    <div class="bar">
      <span class="brand"><span class="mark">N</span>Northline Field</span>
      <span class="steps"><span class="done"></span><span class="done"></span><span class="done"></span></span>
    </div>
    <h1>Your first job</h1>
    <div class="map">
      <svg viewBox="0 0 350 168" role="img" aria-label="Map of the route to the job">
        <path d="M0 120 H350 M0 52 H350 M90 0 V168 M250 0 V168" stroke="var(--border)" stroke-width="10"/>
        <path d="M40 140 L90 140 L90 52 L250 52 L250 30" fill="none" stroke="var(--foreground)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="40" cy="140" r="7" fill="var(--card)" stroke="var(--foreground)" stroke-width="3"/>
        <circle cx="250" cy="30" r="10" fill="var(--foreground)"/>
      </svg>
    </div>
    <div class="job">
      <span class="tag">P2 · Today</span>
      <h2>Replace condenser fan motor</h2>
      <p class="muted" style="margin: 0">418 Ridge Road, North</p>
      <div class="facts">
        <span class="muted">Window<b>10:00 to 12:00</b></span>
        <span class="muted">Drive<b>14 min</b></span>
      </div>
      <ul class="checklist">
        <li>Fan motor FAN-075 is on your van</li>
        <li>Call the customer when you leave</li>
      </ul>
    </div>
    <div class="grow"></div>
    <div class="actions">
      <button type="button">Start the drive</button>
    </div>
  </div>
</body>
</html>
