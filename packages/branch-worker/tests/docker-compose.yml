# Production's PostgreSQL, where each branch gets a database and a role, and the Redis production and
# its branches share, as a team's infrastructure would.
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    command: ["-c", "fsync=off", "-c", "full_page_writes=off"]
    ports:
      - "127.0.0.1:54335:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:46395:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
