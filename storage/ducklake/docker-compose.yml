services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54331:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  s3:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      - mini
      - -dir=/data
      - -master.telemetry=false
      - -admin.ui=false
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: sixb
      AWS_SECRET_ACCESS_KEY: sixb-secret
      S3_BUCKET: sixb-ducklake
    ports:
      - "127.0.0.1:19000:8333"
    healthcheck:
      # Wait for authenticated access to the pre-created bucket, not just a listening port.
      test:
        - CMD-SHELL
        - 'curl -fsS --aws-sigv4 "aws:amz:us-east-1:s3" --user "$$AWS_ACCESS_KEY_ID:$$AWS_SECRET_ACCESS_KEY" --head "http://127.0.0.1:8333/$$S3_BUCKET" > /dev/null'
      interval: 2s
      timeout: 3s
      retries: 20
