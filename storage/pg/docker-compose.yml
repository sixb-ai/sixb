services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    # TLS for the direct-negotiation tests; plain connections are still accepted.
    command:
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      # A throwaway test database: nothing has to survive a crash, so skip the disk flushes.
      # Commits stay synchronous: VACUUM cannot mark an asynchronously committed row visible to
      # all until its WAL is flushed, and index-only scan tests depend on that.
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
