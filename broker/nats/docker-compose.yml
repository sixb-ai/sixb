services:
  nats:
    image: nats:2.10-alpine
    # -js enables JetStream; -p overrides client port so local dev NATS
    # instances on 4222 do not collide with this test server.
    # -m exposes the monitoring endpoint used by the healthcheck.
    command: ["-js", "-p", "42222", "-m", "42223"]
    ports:
      - "42222:42222"
      - "42223:42223"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:42223/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
