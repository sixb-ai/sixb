name: Agent image

# Builds and verifies sandboxes/agent-image on native amd64 and arm64 runners. On main, publishes
# ghcr.io/sixb-ai/sixb-agent:<VERSION> as a multi-platform image. Published versions are immutable:
# bump sandboxes/agent-image/VERSION to release a change.

on:
  pull_request:
    paths:
      - sandboxes/agent-image/**
      - .github/workflows/agent-image.yml
  push:
    branches:
      - main
    paths:
      - sandboxes/agent-image/**
      - .github/workflows/agent-image.yml
  workflow_dispatch:

concurrency:
  group: agent-image-${{ github.ref }}
  # A release must finish once started: cancelling it between pushes strands a partial publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sixb-ai/sixb-agent

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        name: Check whether this version is published
        run: |
          version=$(cat sandboxes/agent-image/VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only main publishes. A pull request, or a dispatch from any other branch, only verifies.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Check with the credentials that push, and treat only "not found" as unpublished. Any
          # other failure (authorization, rate limit, outage) stops the release instead of letting
          # it overwrite a published version.
          if error=$(docker buildx imagetools inspect "$IMAGE:$version" 2>&1 >/dev/null); then
            echo "::notice::$IMAGE:$version is already published; bump VERSION to release changes."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q "$IMAGE:$version: not found" <<< "$error"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not check whether $IMAGE:$version is published: $error"
            exit 1
          fi

  build:
    name: Build and verify (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Build
        run: |
          docker build --platform linux/${{ matrix.arch }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=${{ needs.version.outputs.version }} \
            -t sixb-agent:ci sandboxes/agent-image

      - name: Verify
        run: bun sandboxes/agent-image/verify.ts --image sixb-agent:ci --output "$RUNNER_TEMP/verify"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-image-verification-${{ matrix.arch }}
          path: ${{ runner.temp }}/verify
          if-no-files-found: ignore

      - name: Log in to GHCR
        if: needs.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stage under the commit, not the version: release tags are written only after both
      # architectures pass, so a failure on one never publishes the other.
      - name: Push staging tag
        if: needs.version.outputs.publish == 'true'
        run: |
          docker tag sixb-agent:ci "$IMAGE:staging-${{ github.sha }}-${{ matrix.arch }}"
          docker push "$IMAGE:staging-${{ github.sha }}-${{ matrix.arch }}"

  publish:
    name: Publish multi-platform image
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        run: |
          version=${{ needs.version.outputs.version }}
          staged="$IMAGE:staging-${{ github.sha }}"
          # Copy each verified architecture unchanged, then write the multi-platform tag last. The
          # version check reads that tag, so a release interrupted before it is redone in full.
          for arch in amd64 arm64; do
            docker buildx imagetools create --prefer-index=false \
              -t "$IMAGE:$version-$arch" "$staged-$arch"
          done
          docker buildx imagetools create -t "$IMAGE:$version" "$staged-amd64" "$staged-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Published \`$IMAGE:$version\` (\`$IMAGE@$digest\`)" >> "$GITHUB_STEP_SUMMARY"
